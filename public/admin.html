<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約管理画面</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { 
            font-family: "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN", sans-serif; 
            margin: 0; 
            background: #ffffff; 
            color: #000;
        }

        /* ナビゲーション */
        .admin-nav { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            padding: 15px; 
            background: #fff; 
            border-bottom: 1px solid #ddd; 
            position: sticky; 
            top: 0; 
            z-index: 200;
        }

        /* 日付表示 */
        #nav-current { 
            font-size: 18px; 
            font-weight: bold; 
            padding: 10px 25px; 
            background: #fff; 
            border: 1px solid #000; 
            border-radius: 6px; 
            color: #000; 
            min-width: 150px; 
            text-align: center;
        }

        /* カレンダー入力 */
        #calendar-input { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            opacity: 0;
            cursor: pointer; 
            z-index: 10;
        }

        #calendar-input::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }

        /* ボタン */
        button.nav-btn { 
            background:#000; 
            color:#fff;
            border:none; 
            padding:10px 15px; 
            border-radius:6px; 
            cursor:pointer; 
            font-weight:bold; 
        }

        button.nav-btn:hover {
            background:#333;
        }

        /* コンテナ */
        .admin-container { 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        /* カラム */
.day-column { 
    margin-bottom: 20px;
    background: #fff;
    border-radius: 6px;        /* 予約フォームと統一 */
    border: 1px solid #ccc;    /* 影 → 細い枠線に変更 */
    overflow: hidden;
    position: relative;
}


        /* スロット */
        .slot { 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            padding: 12px 15px; 
            cursor: pointer; 
            transition: 0.2s; 
            min-height: 65px; 
            box-sizing: border-box; 
            border-bottom: 1px solid #eee;
        }

        /* モーダル */
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.4); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }

        .modal-content { 
            background: #fff; 
            padding: 25px; 
            border-radius: 6px; 
            width: 90%; 
            max-width: 400px; 
            border: 1px solid #ccc; 
        }

        /* 入力系 */
        textarea, input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-top: 5px; 
        }
    </style>
</head>

<body>
    <div id="login-screen" style="padding: 100px 20px; text-align: center;">
        <h2 style="margin-bottom:20px;">管理ログイン</h2>
        <input type="password" id="admin-pass" style="max-width:250px; margin-bottom:15px; text-align:center;"><br>
        <button id="login-btn" class="nav-btn" style="width:250px; padding:15px;">ログイン</button>
    </div>

    <div class="admin-container">
        <div class="admin-nav">
            <button class="nav-btn" onclick="moveDate(-1)">&lt;&lt;</button>
            <div class="date-picker-container">
                <div id="nav-current">読み込み中...</div>
                <input type="date" id="calendar-input" onchange="handleCalendarChange(this.value)">
            </div>
            <button class="nav-btn" onclick="moveDate(1)">&gt;&gt;</button>
        </div>
        <div id="days-wrapper"></div>
    </div>

    <div id="slot-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="/api/config.js"></script>
    <script src="admin.js?v=20250204"></script>
</body>
</html>
