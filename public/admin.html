<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約管理画面</title>
    <link rel="apple-touch-icon" href="/admin-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="予約管理">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            margin: 0; background: #f4f4f9; color: #333;
        }
        
        /* ナビゲーション */
        .admin-nav { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            padding: 15px; 
            background: #fff; 
            border-bottom: 1px solid #ddd; 
            position: sticky; 
            top: 0; 
            z-index: 200;
        }
        
        /* カレンダーコンテナ */
        .date-picker-container { 
            position: relative; 
            display: inline-block; 
        }

        /* 日付表示の見た目 */
        #nav-current { 
            font-size: 18px; 
            font-weight: bold; 
            padding: 10px 25px; 
            background: #fff; 
            border: 2px solid #007aff; 
            border-radius: 25px; 
            color: #007aff; 
            min-width: 150px; 
            text-align: center;
            position: relative; 
            z-index: 1;
        }

        #calendar-input { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            opacity: 0;
            cursor: pointer; 
            z-index: 10;
            display: block;
        }

        /* Chromeなどのブラウザでカレンダーアイコンをボタン全体に広げる */
        #calendar-input::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }
        
        button.nav-btn { 
            background: #eee; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        
        .admin-container { 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        
        #days-wrapper {
            overflow-x: auto;
            display: flex;
        }
        
        /* ★ day-column を1箇所に統合 */
        .day-column { 
            background: #fff; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            overflow: hidden; 
            position: relative;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        
        #date-header-row > div {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            text-align: center;
        }

        #date-header-row {
            position: sticky;
            top: 61px;
            z-index: 150;
            background: #f2f2f7;
            padding: 8px 0;
            overflow: hidden;
        }
        
        .time-label { 
            font-size: 16px; 
            font-weight: bold; 
            color: #222; 
            width: 55px; 
            flex-shrink: 0; 
        }
        
        .slot-info { 
            flex-grow: 1; 
            text-align: center; 
            font-size: 16px; 
            font-weight: bold; 
        }
        
        .menu-label { 
            font-size: 14px; 
            font-weight: normal; 
            color: #555; 
            display: block; 
            margin-top: 3px; 
        }
        
        .now-line {
            position: absolute; 
            left: 0; 
            right: 0; 
            height: 2px; 
            background: #ff3b30; 
            z-index: 50; 
            pointer-events: none;
        }
        
        .now-line::after {
            content: ""; 
            position: absolute; 
            left: 0; 
            top: -4px; 
            width: 10px; 
            height: 10px; 
            background: #ff3b30; 
            border-radius: 50%;
        }

        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.6); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }
        
        .modal-content { 
            background: #fff; 
            padding: 25px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        textarea { 
            width: 100%; 
            height: 80px; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            margin-top: 5px; 
        }
        
        input, select { 
            font-size: 16px; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            width: 100%; 
            box-sizing: border-box; 
            margin-top: 5px; 
        }

        /* ★ slot の基本形（border は JS が制御する） */
        .slot {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 12px 15px;
            min-height: 65px;
            box-sizing: border-box;
            background-clip: padding-box;
        }

        /* ★ 中の白背景を完全に消す（白い線の原因） */
        .slot .time-label,
        .slot .slot-info {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div id="login-screen" style="padding: 100px 20px; text-align: center;">
        <h2 style="margin-bottom:20px;">管理ログイン</h2>
        <input type="password" id="admin-pass" style="max-width:250px; margin-bottom:15px; text-align:center;"><br>
        <button id="login-btn" class="nav-btn" style="background:#007aff; color:#fff; width:250px; padding:15px;">ログイン</button>
    </div>

    <div class="admin-container">
        <div class="admin-nav">
            <button class="nav-btn" onclick="moveDate(-1)">&lt;&lt;</button>
            <div class="date-picker-container">
                <div id="nav-current">読み込み中...</div>
                <input type="date" id="calendar-input" onchange="handleCalendarChange(this.value)">
            </div>
            <button class="nav-btn" onclick="moveDate(1)">&gt;&gt;</button>
        </div>
        <div id="days-wrapper"></div>
    </div>

    <div id="slot-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>
<script src="/api/config.js"></script>

<script src="admin.js?v=20250204"></script>
</body>
</html>
