<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candoll 予約フォーム</title>

    <style>
body {
    /* ヒラギノを最優先に指定し、Ralewayを削除しました */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    /* 全体を一貫して細めのウェイトに統一 */
    font-weight: 300; 
    background: #ffffff;
    color: #000000;
    margin: 0;
    padding: 0;
    text-align: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* 数字が含まれる場所も、すべてヒラギノの細い線に統一します */
.date-chip, .time-slot, #durationDisplay, .month-label, .dow-label {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    font-weight: 300 !important;
}

/* 見出しの太さを調整（もし細すぎると感じたらここを400にしてください） */
label, h2 {
    font-weight: 400;
}
        .container {
            width: 90%;
            max-width: 420px;
            margin: 0 auto;
            padding: 20px 0 40px;
        }
        .greeting {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        label {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
            font-weight: 400;
            text-align: left;
        }

        /* --- Apple風入力欄 --- */
        .input-wrapper, .select-wrapper {
            margin-bottom: 25px;
        }
        .menu-stack .select-wrapper {
            margin-bottom: 10px;
        }
        #name, .apple-select {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background-color: #f5f5f7;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .apple-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 18px;
            cursor: pointer;
        }
        .placeholder-color { color: #8e8e93; }
        .selected-color { color: #000; }

        .add-menu-btn {
            color: #007aff;
            font-size: 14px;
            cursor: pointer;
            text-align: right;
            margin-bottom: 20px;
            font-weight: 500;
        }

/* --- 日付チップ（レイアウト固定・細め統一版） --- */
        .date-chips {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 12px;
            padding: 10px 5px 15px; /* 下に少し余裕を持たせる */
            margin-bottom: 25px;
            -webkit-overflow-scrolling: touch;
        }

        /* ★スクロールバーを表示する設定 */
        .date-chips::-webkit-scrollbar {
            display: block !important;
            height: 5px;
        }
        .date-chips::-webkit-scrollbar-thumb {
            background: #d2d2d7;
            border-radius: 10px;
        }

        .date-chip {
            flex: 0 0 68px;
            height: 95px; /* 定休日が入っても大丈夫な高さ */
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            background: #fff;
            position: relative; /* 子要素の基準位置 */
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
            font-weight: 300; /* 細めに統一 */
        }
        .date-chip:active { transform: scale(0.95); }
        /* メニュー未選択時のスタイル */
.date-chip.menu-not-selected {
    opacity: 0.4; /* 薄くする */
    filter: grayscale(100%); /* 白黒にする（任意） */
    cursor: not-allowed;
}

        /* 月表示：左上に固定 */
        .month-label {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 10px;
            font-weight: 300;
            color: #8e8e93;
        }

        /* 日にち数字：中央付近に固定 */
        .date-number {
            position: absolute;
            top: 28px;
            font-size: 24px;
            font-weight: 300;
            line-height: 1;
        }

        /* 曜日表示：数字の下に固定 */
        .dow-label {
            position: absolute;
            top: 54px;
            font-size: 11px;
            font-weight: 300;
        }

        /* 定休日・満席などのステータス：一番下に固定 */
        .status-text {
            position: absolute;
            bottom: 8px;
            font-size: 9px;
            font-weight: 300;
            width: 100%;
            text-align: center;
        }

        /* 選択時・土日の色設定 */
        .date-chip.selected { background: #000; color: #fff !important; border-color: #000; }
        .date-chip.selected .month-label { color: #fff; opacity: 0.8; }
        .date-chip.sat { color: #007aff; }
        .date-chip.sun { color: #ff3b30; }
        .date-chip.holiday {
            background: #f5f5f7;
            color: #d2d2d7 !important;
            border-color: #f5f5f7;
            cursor: not-allowed;
            opacity: 0.6;
        }
        /* ★追加：メニュー未選択時の日付チップを無効化 */
        .date-chip.disabled-by-menu {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none; /* クリックを無効にする */
            background: #f5f5f7;
        }
        .date-chip:not(.holiday) {
    cursor: pointer;
}

        /* --- 時間グリッド --- */
        #timeGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 30px;
            min-height: 250px;
            align-content: start;
        }
        .time-slot {
            padding: 15px 5px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-slot:active { transform: scale(0.95); }
        .time-slot.selected { background: #000; color: #fff; border-color: #000; }
        .time-slot.disabled { background: #f5f5f7; color: #d2d2d7; border-color: #f5f5f7; cursor: not-allowed; }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: #000;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
        }

        #confirm-screen { display: none; padding: 20px; }
        .confirm-btn { width: 45%; padding: 15px; border-radius: 10px; border: none; cursor: pointer; margin: 5px; font-size: 16px; }
        .ok { background: #000; color: #fff; }
        .cancel { background: #f5f5f7; color: #000; }
/* --- 日付チップのスクロールバーを表示 --- */
        .date-chips::-webkit-scrollbar {
            display: block; /* 非表示を解除 */
            height: 5px;
        }
        .date-chips::-webkit-scrollbar-thumb {
            background: #d2d2d7;
            border-radius: 10px;
        }

        /* --- 予約ボタンの固定バナー --- */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            padding: 15px 20px 30px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            z-index: 1000;
        }
        #reserveForm {
            padding-bottom: 120px; /* ボタンと被らないための余白 */
        }

/* ★追加：ボタンが下に来るので、フォームの最後に余白を作って被らないようにする */
#reserveForm {
    padding-bottom: 100px;
}
/* 画面上部に固定される予約通知バナー */
.sticky-reservation-notice-top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.98);
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10000; /* 他の要素より一番上に表示 */
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    height: 60px;
    box-sizing: border-box;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
}

.notice-content {
    display: flex;
    flex-direction: column;
    text-align: left;
}

.notice-title {
    font-size: 10px;
    color: #8e8e93;
    font-weight: 300;
}

.notice-datetime {
    font-size: 15px;
    color: #000;
    font-weight: 300;
}

/* キャンセルボタン（赤） */
.notice-cancel-btn-red {
    background: #ff3b30;
    color: #fff !important;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 400;
    cursor: pointer;
}
    </style>
</head>
<body>
<div class="container">
    <img src="/logo.png" alt="Candoll" style="width: 220px; margin-bottom: 20px;">


    <div class="greeting">
        ご予約内容をお選び下さい
    </div>

    <form id="reserveForm" novalidate>
        <label for="name">NAME</label>
        <div class="input-wrapper">
            <input type="text" id="name" placeholder="お名前(フルネーム)を入力" autocomplete="off">
        </div>

        <label>MENU</label>
        <div id="menuContainer" class="menu-stack">
            <div class="select-wrapper">
                <select class="menu-select apple-select placeholder-color">
                    <option value="">メニューを選択</option>
                </select>
            </div>
        </div>
        <div id="addMenu" class="add-menu-btn">他のメニューを追加</div>

        <label>DATE</label>
        <div id="dateChips" class="date-chips"></div>
        <select id="date" style="display:none;"></select>

<div id="timeGrid"></div>
        <select id="time" style="display:none;"></select>

        <div class="sticky-footer">
    <button class="submit-btn" type="submit">予約を確定する</button>
</div>
    </form>

    <div id="confirm-screen" style="display: none; padding: 20px;">
        <h2 style="font-size: 20px;">予約内容をご確認ください</h2>
        <p id="confirm-text" style="line-height: 1.8; text-align: left; background: #f5f5f7; padding: 20px; border-radius: 12px;"></p>
        <div style="display: flex; justify-content: space-between;">
            <button class="confirm-btn cancel" id="cancelBtn" style="width: 45%;">戻る</button>
            <button class="confirm-btn ok" id="okBtn" style="width: 45%;">OK</button>
        </div>
    </div>

<div id="cancel-screen" style="display: none; padding: 20px;">
    <h2 style="font-size: 20px;">予約のキャンセル</h2>
    <p id="cancel-info" style="line-height: 1.8; text-align: left; background: #fff1f0; padding: 20px; border-radius: 12px; border: 1px solid #ffa39e;"></p>
    <p style="font-size: 14px; color: #86868b; margin-bottom: 20px;">この予約をキャンセルしてもよろしいですか？</p>
    <div style="display: flex; justify-content: space-between; gap: 10px;">
        <button class="confirm-btn cancel" onclick="liff.closeWindow()" style="flex: 1; margin: 0;">戻る</button>
        <button class="confirm-btn ok" id="executeCancelBtn" style="flex: 1; margin: 0; background: #ff4d4f;">キャンセルする</button>
    </div>
</div>
</div> <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=0113"></script>
</body>
</html>
