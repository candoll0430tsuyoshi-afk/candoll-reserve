<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candoll 管理画面</title>

<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    /* ロゴ画像 */
    .logo {
        width: 260px;
        margin: 0 auto 25px;
        display: block;
    }

    /* パスワード画面（背景をグレーに変更） */
    #login-box {
        background: #f5f5f5;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: left;
    }

    input, button {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        border-radius: 6px;
        box-sizing: border-box;
    }

    input {
        margin-top: 10px;
        border: 1px solid #ccc;
    }

    button {
        margin-top: 20px;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    /* 予約一覧 */
    #reserve-list {
        display: none;
        margin-top: 30px;
    }

    .date-title {
        background: #000;
        color: #fff;
        padding: 10px;
        margin-top: 25px;
        border-radius: 5px;
        font-size: 20px;
    }

    .reserve-item {
        background: #fff;
        padding: 12px 15px;
        margin-top: 10px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .time {
        font-weight: bold;
        margin-bottom: 5px;
    }

    .menu {
        color: #333;
        margin-bottom: 3px;
    }

    .name {
        color: #666;
    }
</style>
</head>
<body>

<div class="container">

    <!-- ★ ロゴ -->
    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
         alt="Candoll ロゴ"
         class="logo">

    <!-- ★ パスワード入力ボックス -->
    <div id="login-box">
        <p>Pass</p>
        <input type="password" id="admin-pass" placeholder="パスワード">
        <button id="login-btn">ログイン</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">
            パスワードが違います
        </p>
    </div>

    <!-- ▼▼▼ ここから追加：日付ナビゲーション ▼▼▼ -->
    <div id="date-nav" style="display:none; text-align:center; margin:20px 0;">
        <button id="prevDay" style="padding:10px 16px;">◀ 前日</button>
        <span id="currentDay" style="font-size:18px; font-weight:bold; margin:0 12px;">-</span>
        <button id="nextDay" style="padding:10px 16px;">翌日 ▶</button>
    </div>

    <!-- 3日分を表示するエリア -->
    <div id="days-container"></div>
    <!-- ▲▲▲ 追加ここまで ▲▲▲ -->

    <!-- 予約一覧（旧エリアは残すが内容は days-container に移行） -->
    <div id="reserve-list"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
