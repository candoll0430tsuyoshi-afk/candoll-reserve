<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candoll 管理画面</title>

<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    .logo {
        width: 260px;
        margin: 0 auto 25px;
        display: block;
    }

    #login-box {
        background: #f5f5f5;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: left;
    }

    input, button {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        border-radius: 6px;
        box-sizing: border-box;
    }

    button {
        margin-top: 20px;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    /* ▼ ログイン前は絶対にナビを表示しない */
    #day-navi {
        display: none !important;
        margin: 10px 0 25px;
        font-size: 18px;
        font-weight: bold;
        justify-content: center;
        align-items: center;
        gap: 40px;
    }

    #nav-current {
        font-size: 20px;
        font-weight: bold;
        position: relative;
        top: 4px;
    }

    #day-navi button {
        padding: 8px 16px;
        font-size: 15px;
        background: #000;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        border: none;
        white-space: nowrap;
    }

    /* ▼ 3カラム */
    #days-wrapper {
        max-width: 1000px;
        margin: 0 auto;
        margin-top: 10px;
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: stretch;
        padding: 0 10px;
    }

    .day-column {
        background: #fafafa;
        padding: 10px;
        border-radius: 6px;
        flex: 1;
        min-width: 250px;
        display: flex;
        flex-direction: column;
    }

    /* ▼ 日付タイトル＋追加ボタン */
    .date-title {
        background: #000;
        color: #fff;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
        font-size: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .plus-btn {
        background: #fff;
        color: #000;
        font-size: 26px;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        border: 1px solid #000;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

    /* ▼ popup */
    #popup-bg {
        position: fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background: rgba(0,0,0,0.4);
        display:none;
        justify-content:center;
        align-items:center;
        z-index:2000;
    }

    #popup-box {
        background:#fff;
        padding:20px;
        width: 90%;
        max-width:340px;
        border-radius:10px;
    }

</style>
</head>
<body>

<button id="menu-btn">▼</button>
<div id="menu-box" style="display:none;">
    <div id="m-logout">ログアウト</div>
    <div id="m-add">休日追加</div>
    <div id="m-del">休日解除</div>
</div>

<div class="container">

    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
         class="logo">

    <div id="login-box">
        <p>Pass</p>

        <div style="position: relative; width: 100%;">
            <input type="password" id="admin-pass" placeholder="パスワード" style="padding-right: 45px;">
            <span id="toggle-pass" class="lock-icon locked"></span>
        </div>

        <button id="login-btn">ログイン</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">
            パスワードが違います
        </p>
    </div>

    <div id="day-navi">
        <button id="nav-prev">前の日</button>
        <span id="nav-current">-</span>
        <button id="nav-next">次の日</button>
    </div>
</div>

<div id="days-wrapper"></div>

<div id="popup-bg">
    <div id="popup-box"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
