<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candoll 管理画面</title>

<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    .logo {
        width: 260px;
        margin: 0 auto 25px;
        display: block;
    }

    #login-box {
        background: #f5f5f5;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: left;
    }

    input, button {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        border-radius: 6px;
        box-sizing: border-box;
    }

    input {
        margin-top: 10px;
        border: 1px solid #ccc;
    }

    button {
        margin-top: 20px;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    /* ▼ 追加：＋ボタン（小さめ） */
    .add-btn {
        background: #000;
        color: #fff;
        border: none;
        font-size: 14px;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        margin-left: 8px;
    }

    /* ▼▼ 予約3日間 横並びレイアウト（既存） ▼▼ */
    #days-container {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .day-column {
        width: 32%;
        min-width: 180px;
        background: #fafafa;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .date-title {
        background: #000;
        color: #fff;
        padding: 8px;
        border-radius: 4px;
        font-size: 18px;
        margin-bottom: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* ▼▼ モーダル ▼▼ */
    #addModal {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .modal-box {
        width: 90%;
        max-width: 360px;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        text-align: left;
    }

    .modal-box h2 {
        margin-top: 0;
        text-align: center;
    }

    .modal-box input, .modal-box select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        margin-top: 8px;
        border-radius: 6px;
        font-size: 16px;
    }

    .modal-buttons {
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
    }

    .modal-buttons button {
        width: 48%;
        padding: 12px;
        font-size: 16px;
        border-radius: 6px;
    }
</style>
</head>
<body>

<div class="container">

    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
         alt="Candoll ロゴ"
         class="logo">

    <!-- ログイン画面（そのまま維持） -->
    <div id="login-box">
        <p>Pass</p>

        <div style="position: relative; width: 100%;">
            <input type="password" id="admin-pass" placeholder="パスワード" style="padding-right: 45px;">
            <span id="toggle-pass" class="lock-icon locked"></span>
        </div>

        <button id="login-btn">ログイン</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">
            パスワードが違います
        </p>
    </div>

    <!-- 日付ナビ（既存） -->
    <div id="date-nav" style="display:none; text-align:center; margin:20px 0;">
        <button id="prevDay" style="padding:10px 16px;">◀ 前の日</button>
        <span id="currentDay" style="font-size:18px; font-weight:bold; margin:0 12px;">-</span>
        <button id="nextDay" style="padding:10px 16px;">次の日 ▶</button>
    </div>

    <div id="days-container"></div>
</div>

<!-- ▼▼ 予約追加モーダル ▼▼ -->
<div id="addModal">
  <div class="modal-box">
    <h2>予約追加</h2>

    <label>名前</label>
    <input type="text" id="modal-name">

    <label>メニュー</label>
    <select id="modal-menu"></select>

    <label>開始時間</label>
    <select id="modal-time"></select>

    <div class="modal-buttons">
      <button id="modal-save">保存</button>
      <button id="modal-cancel">キャンセル</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>

<!-- ▼ パスワード表示切替（既存） -->
<script>
const passInput = document.getElementById("admin-pass");
const toggleBtn = document.getElementById("toggle-pass");

toggleBtn.addEventListener("click", () => {
    const isHidden = passInput.type === "password";
    passInput.type = isHidden ? "text" : "password";

    toggleBtn.classList.toggle("unlocked", isHidden);
    toggleBtn.classList.toggle("locked", !isHidden);
});
</script>

</body>
</html>
