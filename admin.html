<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candoll 管理画面</title>

<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    .logo {
        width: 260px;
        margin: 0 auto 25px;
        display: block;
    }

    /* ▼ 右上プルダウン（小型） ▼ */
    #menu-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        background: #000;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        z-index: 999;
        width: 34px;
        text-align: center;
    }

    #menu-box {
        display: none;
        position: fixed;
        top: 50px;
        right: 12px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        width: 120px;
        text-align: left;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        z-index: 1000;
    }

    #menu-box div {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }
    #menu-box div:hover { background: #f0f0f0; }
    #menu-box div:last-child { border-bottom: none; }

    /* ▼ 日付ナビ（左右挟み） ▼ */
    #day-navi {
        display:none;
        margin: 10px 0 25px 0;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
    }

    #day-navi button {
        padding: 8px 16px;
        margin: 0 20px;
        font-size: 15px;
        background: #000;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        border: none;
    }

    #nav-current {
        font-size: 20px;
        margin: 0 10px;
        font-weight: bold;
        color: #000;
    }

    #login-box {
        background: #f5f5f5;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: left;
    }

    #reserve-list {
        display: none;
        margin-top: 10px;
    }

    .date-title {
        background: #000;
        color: #fff;
        padding: 10px;
        margin-top: 20px;
        border-radius: 5px;
        font-size: 20px;
    }

    .reserve-item {
        background: #fff;
        padding: 12px 15px;
        margin-top: 10px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
</style>
</head>
<body>

<!-- ▼ 右上 ▼ メニュー -->
<button id="menu-btn">▼</button>
<div id="menu-box">
    <div id="m-logout">ログアウト</div>
    <div id="m-add">休日追加</div>
    <div id="m-del">休日解除</div>
</div>

<div class="container">

    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
         alt="Candoll ロゴ"
         class="logo">

    <div id="login-box">
        <p>Pass</p>

        <div style="position: relative; width: 100%;">
            <input type="password" id="admin-pass" placeholder="パスワード" style="padding-right: 45px;">
            <span id="toggle-pass" class="lock-icon locked"></span>
        </div>

        <button id="login-btn">ログイン</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">
            パスワードが違います
        </p>
    </div>

    <!-- ▼ 黒ボタン日付ナビ（左右ハサミ） -->
    <div id="day-navi">
        <button id="nav-prev">前の日</button>
        <span id="nav-current">-</span>
        <button id="nav-next">次の日</button>
    </div>

    <!-- ※ days-container は JS が使ってないため削除 -->
    <div id="reserve-list"></div>

</div>

<script src="admin.js"></script>

<script>
const passInput = document.getElementById("admin-pass");
const toggleBtn = document.getElementById("toggle-pass");

toggleBtn.onclick = () => {
    passInput.type = passInput.type === "password" ? "text" : "password";
    toggleBtn.classList.toggle("unlocked");
};
</script>

<script>
const menuBtn = document.getElementById("menu-btn");
const menuBox = document.getElementById("menu-box");

menuBtn.onclick = () => {
    menuBox.style.display = menuBox.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
    if (!menuBtn.contains(e.target) && !menuBox.contains(e.target)) {
        menuBox.style.display = "none";
    }
});
</script>

</body>
</html>
