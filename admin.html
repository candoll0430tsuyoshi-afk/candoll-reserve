<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candoll 管理画面</title>

<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    /* ロゴ画像 */
    .logo {
        width: 260px;
        margin: 0 auto 25px;
        display: block;
    }

    /* ▼ ログアウトボタン（追加） ▼ */
    #logout-btn {
        display: none;
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 8px 14px;
        background: #d9534f;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        z-index: 999;
    }

    /* パスワード画面（背景をグレーに変更） */
    #login-box {
        background: #f5f5f5;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: left;
    }

    input, button {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        border-radius: 6px;
        box-sizing: border-box;
    }

    input {
        margin-top: 10px;
        border: 1px solid #ccc;
    }

    button {
        margin-top: 20px;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    /* 予約一覧 */
    #reserve-list {
        display: none;
        margin-top: 30px;
    }

    .date-title {
        background: #000;
        color: #fff;
        padding: 10px;
        margin-top: 25px;
        border-radius: 5px;
        font-size: 20px;
    }

    .reserve-item {
        background: #fff;
        padding: 12px 15px;
        margin-top: 10px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .time {
        font-weight: bold;
        margin-bottom: 5px;
    }

    .menu {
        color: #333;
        margin-bottom: 3px;
    }

    .name {
        color: #666;
    }

    /* ▼ パスワード鍵アイコン ▼ */
    .lock-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 24px;
        height: 24px;
        cursor: pointer;
    }

    .lock-icon::before,
    .lock-icon::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
    }

    /* 鍵のわっか部分（ロック状態） */
    .lock-icon::before {
        top: 1px;
        width: 14px;
        height: 10px;
        border: 2px solid #555;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        transition: transform 0.2s ease, left 0.2s ease;
    }

    /* 鍵の本体部分 */
    .lock-icon::after {
        top: 9px;
        width: 16px;
        height: 11px;
        border-radius: 3px;
        background: #555;
    }

    /* アンロック状態（わっかを少し傾ける） */
    .lock-icon.unlocked::before {
        transform: translateX(-50%) rotate(-25deg);
        left: 55%;
    }
</style>
</head>
<body>

<!-- ★ ログアウトボタン（追加） -->
<button id="logout-btn">ログアウト</button>

<div class="container">

    <!-- ★ ロゴ -->
    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
         alt="Candoll ロゴ"
         class="logo">

    <!-- ★ パスワード入力ボックス -->
    <div id="login-box">
        <p>Pass</p>

        <!-- ▼ パスワード + 鍵アイコン -->
        <div style="position: relative; width: 100%;">
            <input type="password" id="admin-pass" placeholder="パスワード" style="padding-right: 45px;">
            <span id="toggle-pass" class="lock-icon locked"></span>
        </div>

        <button id="login-btn">ログイン</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">
            パスワードが違います
        </p>
    </div>

    <!-- ▼▼▼ ここから追加：日付ナビゲーション ▼▼▼ -->
    <div id="date-nav" style="display:none; text-align:center; margin:20px 0;">
        <button id="prevDay" style="padding:10px 16px;">◀ 前日</button>
        <span id="currentDay" style="font-size:18px; font-weight:bold; margin:0 12px;">-</span>
        <button id="nextDay" style="padding:10px 16px;">翌日 ▶</button>
    </div>

    <!-- 3日分を表示するエリア -->
    <div id="days-container"></div>
    <!-- ▲▲▲ 追加ここまで ▲▲▲ -->

    <!-- 予約一覧（旧エリアは残すが内容は days-container に移行） -->
    <div id="reserve-list"></div>

</div>

<script src="admin.js"></script>

<!-- ▼ パスワード表示切替（鍵アイコン） ▼ -->
<script>
const passInput = document.getElementById("admin-pass");
const toggleBtn = document.getElementById("toggle-pass");

toggleBtn.addEventListener("click", () => {
    const isHidden = passInput.type === "password";
    passInput.type = isHidden ? "text" : "password";

    if (isHidden) {
        toggleBtn.classList.remove("locked");
        toggleBtn.classList.add("unlocked");
    } else {
        toggleBtn.classList.remove("unlocked");
        toggleBtn.classList.add("locked");
    }
});
</script>

<!-- ▼ ログアウト処理（追加） ▼ -->
<script>
document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("candoll-admin-password");

    document.getElementById("login-box").style.display = "block";
    document.getElementById("reserve-list").style.display = "none";
    document.getElementById("date-nav").style.display = "none";
    document.getElementById("days-container").innerHTML = "";
    document.getElementById("admin-pass").value = "";

    document.getElementById("logout-btn").style.display = "none";
});
</script>

</body>
</html>
