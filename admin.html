<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約管理画面</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>管理ログイン</h2>
            <input type="password" id="admin-pass" placeholder="パスワード">
            <button id="login-btn">ログイン</button>
        </div>
    </div>

    <div class="admin-container">
        <div class="admin-nav" style="display: flex; justify-content: center; align-items: center; gap: 20px; padding: 20px;">
            <button onclick="moveDate(-1)" style="background:#eee; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">前日</button>
            
            <div style="text-align:center;">
                <div id="nav-current" style="font-size:18px; font-weight:bold; padding:8px 20px; background:#fff; border:1px solid #ddd; border-radius:20px; cursor:pointer;">
                    読み込み中...
                </div>
                <input type="date" id="calendar-input" style="opacity:0; position:absolute; pointer-events:none;" onchange="handleCalendarChange(this.value)">
            </div>

            <button onclick="moveDate(1)" style="background:#eee; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">翌日</button>
        </div>

        <div id="days-wrapper"></div>
    </div>

    <div id="slot-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
