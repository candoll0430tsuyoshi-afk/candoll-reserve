<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約管理画面</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* フォントをモダンなシステムフォントに設定 */
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            margin: 0; background: #f9f9f9; color: #333; line-height: 1.5;
        }
        .admin-nav { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 20px; background: #fff; border-bottom: 1px solid #ddd; }
        
        .date-picker-container { position: relative; display: inline-block; }
        #nav-current { 
            font-size: 18px; font-weight: bold; padding: 10px 20px; 
            background: #fff; border: 1px solid #007aff; border-radius: 25px; 
            color: #007aff; cursor: pointer; min-width: 140px; text-align: center;
        }
        #calendar-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; z-index: 10;
        }
        
        button.nav-btn { background:#eee; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:bold; }
        
        #days-wrapper { padding: 15px; }
        .day-column { margin-bottom: 25px; }
        
        /* スロットのデザイン */
        .slot { 
            display: flex; flex-direction: row; align-items: center; /* 横並び */
            padding: 10px 15px; cursor: pointer; transition: 0.2s;
            border: 1px solid #eee; margin-bottom: 4px; border-radius: 8px;
            min-height: 50px;
        }
        /* 時間は左寄せ */
        .time-label { 
            font-size: 16px; font-weight: bold; color: #222; 
            width: 50px; flex-shrink: 0; text-align: left;
        }
        /* 名前とメニューは中央寄せ */
        .slot-info { 
            flex-grow: 1; text-align: center; font-size: 16px; font-weight: bold;
        }
        /* メニューの文字を少し大きく、線は細く */
        .menu-label { 
            font-size: 14px; font-weight: normal; color: #555; display: block; margin-top: 2px;
        }
        
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: #fff; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input, select { font-size: 16px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="login-screen" style="padding: 100px 20px; text-align: center;">
        <h2 style="margin-bottom:20px;">管理ログイン</h2>
        <input type="password" id="admin-pass" style="max-width:250px; margin-bottom:15px; text-align:center;"><br>
        <button id="login-btn" class="nav-btn" style="background:#007aff; color:#fff; width:250px; padding:15px;">ログイン</button>
    </div>

    <div class="admin-container">
        <div class="admin-nav">
            <button class="nav-btn" onclick="moveDate(-1)">前日</button>
            <div class="date-picker-container">
                <div id="nav-current">読み込み中...</div>
                <input type="date" id="calendar-input" onchange="handleCalendarChange(this.value)">
            </div>
            <button class="nav-btn" onclick="moveDate(1)">翌日</button>
        </div>
        <div id="days-wrapper"></div>
    </div>

    <div id="slot-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
