<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約管理画面</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; 
            margin: 0; background: #f4f4f9; color: #333;
        }
        .admin-nav { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 20px; background: #fff; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 100; }
        
        .date-picker-container { position: relative; display: inline-block; }
        #nav-current { 
            font-size: 18px; font-weight: bold; padding: 10px 20px; 
            background: #fff; border: 1px solid #007aff; border-radius: 25px; 
            color: #007aff; cursor: pointer; min-width: 140px; text-align: center;
        }
        #calendar-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        
        button.nav-btn { background:#eee; border:none; padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:bold; }
        
        #days-wrapper { padding: 15px; position: relative; }
        .day-column { margin-bottom: 25px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; position: relative; }
        
        .slot { display: flex; flex-direction: row; align-items: center; padding: 10px 15px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #f0f0f0; min-height: 55px; box-sizing: border-box; }
        .time-label { font-size: 16px; font-weight: bold; color: #222; width: 60px; flex-shrink: 0; }
        .slot-info { flex-grow: 1; text-align: center; font-size: 16px; font-weight: bold; }
        .menu-label { font-size: 13px; font-weight: normal; color: #666; display: block; margin-top: 2px; }
        
        /* 現在時刻のライン */
        .now-line {
            position: absolute; left: 0; right: 0; height: 2px; background: #ff3b30; z-index: 50; pointer-events: none;
        }
        .now-line::before {
            content: ""; position: absolute; left: 0; top: -4px; width: 10px; height: 10px; background: #ff3b30; border-radius: 50%;
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 14px; margin-top: 5px; }
        input, select { font-size: 16px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="login-screen" style="padding: 100px 20px; text-align: center;">
        <h2 style="margin-bottom:20px;">管理ログイン</h2>
        <input type="password" id="admin-pass" style="max-width:250px; margin-bottom:15px; text-align:center;"><br>
        <button id="login-btn" class="nav-btn" style="background:#007aff; color:#fff; width:250px; padding:15px;">ログイン</button>
    </div>

    <div class="admin-container">
        <div class="admin-nav">
            <button class="nav-btn" onclick="moveDate(-1)">前日</button>
            <div class="date-picker-container">
                <div id="nav-current">読み込み中...</div>
                <input type="date" id="calendar-input" onchange="handleCalendarChange(this.value)">
            </div>
            <button class="nav-btn" onclick="moveDate(1)">翌日</button>
        </div>
        <div id="days-wrapper"></div>
    </div>

    <div id="slot-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
