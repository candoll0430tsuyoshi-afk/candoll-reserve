<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candoll 管理画面</title>

<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 600px; /* ← 元のログイン画面サイズに完全復元 */
        margin: 30px auto;
        padding: 20px;
        text-align: center;
    }

    .logo {
        width: 260px;
        margin: 0 auto 25px;
        display: block;
    }

    /* ▼ ログイン画面（完全復元） */
    #login-box {
        background: #f5f5f5;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: left;
    }

    input, button {
        width: 100%;
        padding: 15px;                 /* ← 元の太いデザインに復元 */
        font-size: 18px;               /* ← 元の大きく見やすい文字 */
        border-radius: 6px;
        box-sizing: border-box;
    }

    input {
        margin-top: 10px;
        border: 1px solid #ccc;
    }

    button {
        margin-top: 20px;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    /* ▼ パスワード鍵アイコン（完全復元） */
    .lock-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 24px;
        height: 24px;
        cursor: pointer;
    }
    .lock-icon::before,
    .lock-icon::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
    }
    .lock-icon::before {
        top: 1px;
        width: 14px;
        height: 10px;
        border: 2px solid #555;
        border-bottom: none;
        border-radius: 10px 10px 0 0;
        transition: transform 0.2s ease, left 0.2s ease;
    }
    .lock-icon::after {
        top: 9px;
        width: 16px;
        height: 11px;
        border-radius: 3px;
        background: #555;
    }
    .lock-icon.unlocked::before {
        transform: translateX(-50%) rotate(-25deg);
        left: 55%;
    }

    /* ▼ 右上プルダウン */
    #menu-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        background: #000;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        z-index: 999;
        width: 34px;
        text-align: center;
    }

    #menu-box {
        display: none;
        position: fixed;
        top: 50px;
        right: 12px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        width: 120px;
        text-align: left;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        z-index: 1000;
    }

    #menu-box div {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }
    #menu-box div:hover { background: #f0f0f0; }
    #menu-box div:last-child { border-bottom: none; }

    /* ▼ 日付ナビ（左右ボタンで中央挟み） */
    #day-navi {
        display:none;
        margin: 10px 0 25px 0;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
    }

    #day-navi button {
        padding: 8px 16px;
        margin: 0 20px;
        font-size: 15px;
        background: #000;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        border: none;
    }

    #nav-current {
        font-size: 20px;
        margin: 0 10px;
        font-weight: bold;
        color: #000;
    }

    /* ▼ 3カラム横並び（ログイン画面に影響しない配置） */
    #days-wrapper {
        max-width: 900px;
        margin: 0 auto;
        margin-top: 10px;

        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: stretch;
        padding: 0 10px;
    }

    .day-column {
        background: #fafafa;
        padding: 10px;
        border-radius: 6px;
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
    }

    .date-title {
        background: #000;
        color: #fff;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
        font-size: 20px;
    }
</style>
</head>
<body>

<button id="menu-btn">▼</button>
<div id="menu-box">
    <div id="m-logout">ログアウト</div>
    <div id="m-add">休日追加</div>
    <div id="m-del">休日解除</div>
</div>

<div class="container">

    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
         alt="Candoll ロゴ"
         class="logo">

    <div id="login-box">
        <p>Pass</p>

        <div style="position: relative; width: 100%;">
            <input type="password" id="admin-pass" placeholder="パスワード" style="padding-right: 45px;">
            <span id="toggle-pass" class="lock-icon locked"></span>
        </div>

        <button id="login-btn">ログイン</button>
        <p id="login-error" style="color:red; display:none; margin-top:10px;">
            パスワードが違います
        </p>
    </div>

    <div id="day-navi">
        <button id="nav-prev">前の日</button>
        <span id="nav-current">-</span>
        <button id="nav-next">次の日</button>
    </div>
</div>

<!-- ▼ container の外に 3カラム表示 -->
<div id="days-wrapper"></div>

<script src="admin.js"></script>

<script>
const passInput = document.getElementById("admin-pass");
const toggleBtn = document.getElementById("toggle-pass");

toggleBtn.onclick = () => {
    const isHidden = passInput.type === "password";
    passInput.type = isHidden ? "text" : "password";
    toggleBtn.classList.toggle("unlocked", isHidden);
};
</script>

<script>
const menuBtn = document.getElementById("menu-btn");
const menuBox = document.getElementById("menu-box");

menuBtn.onclick = () => {
    menuBox.style.display = menuBox.style.display === "block" ? "none" : "block";
};

document.addEventListener("click", (e) => {
    if (!menuBtn.contains(e.target) && !menuBox.contains(e.target)) {
        menuBox.style.display = "none";
    }
});
</script>

</body>
</html>
