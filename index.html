<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candoll 予約フォーム</title>
<style>
 body {
     font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
     background: #ffffff;
     color: #000000;
     margin: 0;
     padding: 0;
     text-align: center;
 }
 .container {
     width: 90%;
     max-width: 420px;
     margin: 0 auto;
     padding: 20px 0 40px;
     text-align: center;
 }
 .logo {
     width: 120px;
     margin: 0 auto 20px;
     display: block;
 }
 .greeting {
     font-size: 16px;
     line-height: 1.6;
     margin-bottom: 20px;
     text-align: center;
 }
 label {
     font-size: 18px;
     display: block;
     margin-bottom: 8px;
     font-weight: 600;
     text-align: center;
 }
 select, input {
     width: 100%;
     padding: 12px;
     font-size: 17px;
     border: 1px solid #000;
     border-radius: 6px;
     margin-bottom: 20px;
 }
 .submit-btn {
     width: 100%;
     padding: 18px;
     background: #000;
     color: #fff;
     font-size: 20px;
     border: none;
     border-radius: 10px;
     cursor: pointer;
     margin-top: 10px;
 }
 #menuContainer {
     display: flex;
     flex-direction: column;
     gap: 10px;
 }
 #addMenu {
     color: #007bff;
     font-size: 14px;
     cursor: pointer;
     margin-bottom: 15px;
 }
 #confirm-screen {
     display: none;
     padding: 20px;
 }
 .confirm-btn {
     width: 45%;
     padding: 15px;
     font-size: 18px;
     border-radius: 8px;
     margin: 10px;
 }
 .ok { background: #000; color: #fff; }
 .cancel { background: #ccc; }
 #name { width: 100%; box-sizing: border-box; display: block; }
</style>
</head>
<body>
<div class="container">

<img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
     alt="Candoll ロゴ"
     style="width: 250px; display: block; margin: 0 auto 20px;">

<!-- ★ greeting に id を付与（消すため） -->
<div class="greeting" id="greeting">
    いつもお世話になっております。<br>
    ご予約内容をお選び下さい。
</div>

<form id="reserveForm">

    <label for="name">お名前</label>
    <input type="text" id="name" placeholder="お名前を入力" required>

    <label for="menu">メニュー</label>
    <div id="menuContainer">
        <select class="menu-select">
            <option value="">選択してください</option>
            <optgroup label="組み合わせ">
                <option value="カット＋カラー">カット＋カラー</option>
                <option value="カット＋リタッチカラー">カット＋リタッチカラー</option>
                <option value="カット＋パーマ">カット＋パーマ</option>
                <option value="カット＋ストレート">カット＋ストレート</option>
            </optgroup>
            <optgroup label="カット">
                <option value="カット">カット</option>
                <option value="カット（大学生・専門学生）">カット（大学生・専門学生）</option>
                <option value="カット（中学生以下）">カット（中学生以下）</option>
                <option value="前髪カット">前髪カット</option>
            </optgroup>
            <optgroup label="カラー">
                <option value="カラー">カラー</option>
                <option value="リタッチカラー">リタッチカラー</option>
                <option value="ダブルカラー">ダブルカラー</option>
                <option value="アクセントカラー">アクセントカラー</option>
                <option value="ヘナ">ヘナ</option>
            </optgroup>
            <optgroup label="パーマ">
                <option value="モイストパーマ">モイストパーマ</option>
                <option value="ポイントパーマ">ポイントパーマ</option>
            </optgroup>
            <optgroup label="ストレート">
                <option value="ストレートパーマ">ストレートパーマ</option>
                <option value="ポイントストレートパーマ">ポイントストレートパーマ</option>
            </optgroup>
            <optgroup label="トリートメント">
                <option value="トリートメント">トリートメント</option>
            </optgroup>
            <optgroup label="メニュー未定">
                <option value="来店時に相談（２時間枠）">来店時に相談（２時間枠）</option>
                <option value="来店時に相談（３時間枠）">来店時に相談（３時間枠）</option>
            </optgroup>
        </select>
    </div>

    <div id="addMenu">＋ メニューを追加する</div>

    <label for="date">日付</label>
    <select id="date" required></select>

    <label for="time">時間</label>
    <select id="time" required>
        <option value="">時間を選択</option>
        <option value="10:00">10:00</option>
        <option value="10:30">10:30</option>
        <option value="11:00">11:00</option>
        <option value="11:30">11:30</option>
        <option value="12:00">12:00</option>
        <option value="12:30">12:30</option>
        <option value="13:00">13:00</option>
        <option value="13:30">13:30</option>
        <option value="14:00">14:00</option>
        <option value="14:30">14:30</option>
        <option value="15:00">15:00</option>
        <option value="15:30">15:30</option>
        <option value="16:00">16:00</option>
        <option value="16:30">16:30</option>
        <option value="17:00">17:00</option>
        <option value="17:30">17:30</option>
        <option value="18:00">18:00</option>
    </select>

    <button class="submit-btn" type="submit">予約する</button>
    <p style="font-size:12px; color:#555; margin-top:10px;">
        ※ キャンセルをご希望の場合は、お電話にて承ります。
    </p>
</form>

<!-- 確認画面 -->
<div id="confirm-screen">
    <h2>ご予約内容</h2>
    <p id="confirm-text"></p>

    <!-- ★ 文言変更 -->
    <button class="confirm-btn ok" id="okBtn">OK</button>
    <button class="confirm-btn cancel" id="cancelBtn">戻る</button>
</div>

</div>

<!-- ★ 定休日処理（そのまま） -->
<script>
const dateSelect = document.getElementById("date");
dateSelect.innerHTML = '<option value="">日付を選択</option>';
const days = ['日','月','火','水','木','金','土'];

for (let i = 0; i < 30; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const y = d.getFullYear();
    const m = (d.getMonth()+1).toString().padStart(2,"0");
    const day = d.getDate().toString().padStart(2,"0");
    const dow = d.getDay();

    if (dow===1) continue;
    if (dow===2){
        const week = Math.ceil(d.getDate()/7);
        if (week===1 || week===3) continue;
    }

    const op = document.createElement("option");
    op.value = `${y}-${m}-${day}`;
    op.textContent = `${y}/${m}/${day} (${days[dow]})`;
    dateSelect.appendChild(op);
}
</script>

<!-- Supabase & script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
