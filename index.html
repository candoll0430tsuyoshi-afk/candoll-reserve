<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candoll 予約フォーム</title>

    <style>
        body {
            font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
            background: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 420px;
            margin: 0 auto;
            padding: 20px 0 40px;
        }
        .greeting {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        label {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            text-align: left;
        }

        /* --- Apple風入力欄 --- */
        .input-wrapper, .select-wrapper {
            margin-bottom: 25px;
        }
        .menu-stack .select-wrapper {
            margin-bottom: 10px;
        }
        #name, .apple-select {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background-color: #f5f5f7;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .apple-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 18px;
            cursor: pointer;
        }
        .placeholder-color { color: #8e8e93; }
        .selected-color { color: #000; }

        .add-menu-btn {
            color: #007aff;
            font-size: 14px;
            cursor: pointer;
            text-align: right;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* --- 日付チップ（横並び修正版） --- */
        .date-chips {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 12px;
            padding: 10px 5px;
            margin-bottom: 25px;
            -webkit-overflow-scrolling: touch;
        }
        .date-chips::-webkit-scrollbar { display: none; }

        .date-chip {
            flex: 0 0 68px; /* 幅を固定して縦並びを防止 */
            height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            background: #fff;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
            padding-top: 12px;
        }
        .date-chip:active { transform: scale(0.95); }

        .month-label {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 10px;
            font-weight: bold;
            color: #8e8e93;
        }
        .dow-label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 2px;
        }

        .date-chip.selected { background: #000; color: #fff !important; border-color: #000; }
        .date-chip.selected .month-label { color: #fff; opacity: 0.8; }
        .date-chip.sat { color: #007aff; }
        .date-chip.sun { color: #ff3b30; }
        .date-chip.holiday {
            background: #f5f5f7;
            color: #d2d2d7 !important;
            border-color: #f5f5f7;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* --- 時間グリッド --- */
        #timeGrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 30px;
            min-height: 250px;
            align-content: start;
        }
        .time-slot {
            padding: 15px 5px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-slot:active { transform: scale(0.95); }
        .time-slot.selected { background: #000; color: #fff; border-color: #000; }
        .time-slot.disabled { background: #f5f5f7; color: #d2d2d7; border-color: #f5f5f7; cursor: not-allowed; }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: #000;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
        }

        #confirm-screen { display: none; padding: 20px; }
        .confirm-btn { width: 45%; padding: 15px; border-radius: 10px; border: none; cursor: pointer; margin: 5px; font-size: 16px; }
        .ok { background: #000; color: #fff; }
        .cancel { background: #f5f5f7; color: #000; }
    </style>
</head>
<body>
<div class="container">
    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png" alt="Candoll" style="width: 220px; margin-bottom: 20px;">

    <div class="greeting">
        ご予約内容をお選び下さい。
    </div>

    <form id="reserveForm" novalidate>
        <label for="name">お名前</label>
        <div class="input-wrapper">
            <input type="text" id="name" placeholder="お名前を入力してください" autocomplete="off">
        </div>

        <label>メニュー</label>
        <div id="menuContainer" class="menu-stack">
            <div class="select-wrapper">
                <select class="menu-select apple-select placeholder-color">
                    <option value="">メニューを選択してください</option>
                </select>
            </div>
        </div>
        <div id="addMenu" class="add-menu-btn">他のメニューを追加</div>

        <label>日付</label>
        <div id="dateChips" class="date-chips"></div>
        <select id="date" style="display:none;"></select>

<div id="timeGrid"></div>
        <select id="time" style="display:none;"></select>

        <button class="submit-btn" type="submit">予約を確定する</button>
    </form>

    <div id="confirm-screen" style="display: none; padding: 20px;">
        <h2 style="font-size: 20px;">予約内容をご確認ください</h2>
        <p id="confirm-text" style="line-height: 1.8; text-align: left; background: #f5f5f7; padding: 20px; border-radius: 12px;"></p>
        <div style="display: flex; justify-content: space-between;">
            <button class="confirm-btn cancel" id="cancelBtn" style="width: 45%;">戻る</button>
            <button class="confirm-btn ok" id="okBtn" style="width: 45%;">OK</button>
        </div>
    </div>

<div id="cancel-screen" style="display: none; padding: 20px;">
        <h2 style="font-size: 20px;">予約のキャンセル</h2>
        
        <div id="cancel-status" style="display: none; font-size: 22px; font-weight: bold; color: #ff4d4f; margin-bottom: 20px;">
            予約をキャンセルしました。
        </div>

        <p id="cancel-info" style="line-height: 1.8; text-align: left; background: #fff1f0; padding: 20px; border-radius: 12px; border: 1px solid #ffa39e;"></p>
        
        <p id="cancel-confirm-msg" style="font-size: 20px; font-weight: bold; color: #000; margin-bottom: 20px;">本当にキャンセルして<br>よろしいですか？</p>
        
        <div id="cancel-buttons" style="display: flex; justify-content: space-between; gap: 10px;">
            <button class="confirm-btn cancel" onclick="liff.closeWindow()" style="flex: 1; margin: 0;">戻る</button>
            <button class="confirm-btn ok" id="executeCancelBtn" style="flex: 1; margin: 0; background: #ff4d4f;">キャンセルする</button>
        </div>
    </div>
</div> <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
