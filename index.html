<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candoll 予約フォーム</title>
<style>
body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #fff;
    color: #000;
    margin: 0;
    padding: 0;
    text-align: center;
}
.container {
    width: 90%;
    max-width: 420px;
    margin: 0 auto;
    padding: 20px 0 40px;
}
.logo {
    width: 120px;
    margin: 0 auto 20px;
    display: block;
}
.greeting {
    font-size: 16px;
    margin-bottom: 20px;
}
label {
    font-size: 18px;
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}
select, .time-btn {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: 1px solid #000;
    border-radius: 6px;
    margin-bottom: 10px;
    cursor: pointer;
}
.time-btn {
    margin-bottom: 5px;
    background: #fff;
}
.submit-btn {
    width: 100%;
    padding: 18px;
    background: #000;
    color: #fff;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
}
</style>
</head>
<body>
<div class="container">
    <img src="logo.png" alt="Candoll Logo" class="logo">
    <div class="greeting">
        いつもお世話になっております。<br>
        ご予約内容をお選び下さい。
    </div>
    <form id="reserveForm">
        <label for="menu">メニュー</label>
        <div id="menuContainer">
            <select class="menu-select">
                <option value="">選択してください</option>
                <optgroup label="組み合わせ">
                    <option value="カット＋カラー">カット＋カラー</option>
                    <option value="カット＋リタッチカラー">カット＋リタッチカラー</option>
                    <option value="カット＋パーマ">カット＋パーマ</option>
                    <option value="カット＋ストレート">カット＋ストレート</option>
                </optgroup>
                <optgroup label="カット">
                    <option value="カット">カット</option>
                    <option value="カット（大学生・専門学生）">カット（大学生・専門学生）</option>
                    <option value="カット（中学生以下）">カット（中学生以下）</option>
                    <option value="前髪カット">前髪カット</option>
                </optgroup>
                <optgroup label="カラー">
                    <option value="カラー">カラー</option>
                    <option value="リタッチカラー">リタッチカラー</option>
                    <option value="ダブルカラー">ダブルカラー</option>
                    <option value="アクセントカラー">アクセントカラー</option>
                    <option value="ヘナ">ヘナ</option>
                </optgroup>
                <optgroup label="パーマ">
                    <option value="モイストパーマ">モイストパーマ</option>
                    <option value="ポイントパーマ">ポイントパーマ</option>
                </optgroup>
                <optgroup label="ストレート">
                    <option value="ストレートパーマ">ストレートパーマ</option>
                    <option value="ポイントストレートパーマ">ポイントストレートパーマ</option>
                </optgroup>
                <optgroup label="トリートメント">
                    <option value="トリートメント">トリートメント</option>
                </optgroup>
                <optgroup label="メニュー未定">
                    <option value="来店時に相談（２時間枠）">来店時に相談（２時間枠）</option>
                    <option value="来店時に相談（３時間枠）">来店時に相談（３時間枠）</option>
                </optgroup>
            </select>
        </div>

        <label for="date">日付</label>
        <select id="date" required></select>

        <label for="time">時間</label>
        <div id="timeContainer"></div>

        <button class="submit-btn" type="submit">予約する</button>
    </form>
</div>

<script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
<script>
window.onload = async function() {
    liff.init({ liffId: "2008442624-YB13z2B1" }).then(async () => {
        if (!liff.isLoggedIn()) liff.login();
    });

    // 日付プルダウン作成
    const dateSelect = document.getElementById("date");
    const daysOfWeek = ['日','月','火','水','木','金','土'];
    for (let i=0; i<30; i++){
        const d = new Date();
        d.setDate(d.getDate()+i);
        const y=d.getFullYear();
        const m=(d.getMonth()+1).toString().padStart(2,'0');
        const day=d.getDate().toString().padStart(2,'0');
        const dow=daysOfWeek[d.getDay()];
        const option = document.createElement('option');
        option.value = `${y}-${m}-${day}`;
        option.textContent = `${y}/${m}/${day} (${dow})`;
        dateSelect.appendChild(option);
    }

    // 日付変更で空き時間取得
    dateSelect.addEventListener('change', async function() {
        if(!this.value) return;
        const res = await fetch(`/api/freeTimes?date=${this.value}`);
        const data = await res.json();
        renderTimeButtons(data.freeTimes);
    });
};

// メニュー複数選択
const menuContainer = document.getElementById('menuContainer');
menuContainer.addEventListener('change', function(e){
    if(e.target.classList.contains('menu-select') && e.target.value!==''){
        const selects = menuContainer.querySelectorAll('.menu-select');
        if(selects.length<4){
            const newSelect = e.target.cloneNode(true);
            newSelect.value='';
            newSelect.required=false;
            menuContainer.appendChild(newSelect);
        }
    }
});

let selectedTime = null;
function renderTimeButtons(freeTimes){
    const container = document.getElementById("timeContainer");
    container.innerHTML='';
    freeTimes.forEach(t=>{
        const btn = document.createElement("button");
        btn.type="button";
        btn.textContent = t;
        btn.className="time-btn";
        btn.onclick = () => {
            selectedTime = t;
            document.querySelectorAll(".time-btn").forEach(b => {
                b.style.background="#fff";
                b.style.color="#000";
            });
            btn.style.background="#000";
            btn.style.color="#fff";
        };
        container.appendChild(btn);
    });
}

// 予約送信
document.getElementById('reserveForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const menus = Array.from(menuContainer.querySelectorAll('.menu-select'))
                       .map(s=>s.value).filter(v=>v!=='');
    if(menus.length===0) return alert('メニューを選択してください');
    if(!selectedTime) return alert('空き時間を選択してください');
    const date = document.getElementById("date").value;

    const profile = await liff.getProfile();

    const res = await fetch('/api/reserve',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            name: profile.displayName,
            menus,
            date,
            time: selectedTime
        })
    });
    const result = await res.json();
    alert(result.message);
});
</script>
</body>
</html>
