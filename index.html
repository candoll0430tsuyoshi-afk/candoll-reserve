<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candoll 予約フォーム</title>

<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        color: #000000;
        margin: 0;
        padding: 0;
        text-align: center;
    }

    .container {
        width: 90%;
        max-width: 420px;
        margin: 0 auto;
        padding: 20px 0 40px;
        text-align: center;
    }

    .logo {
        width: 120px;
        margin: 0 auto 20px;
        display: block;
    }

    .greeting {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 20px;
        white-space: pre-line;
        text-align: center;
    }

    label {
        font-size: 18px;
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        text-align: center;
    }

    select {
        width: 100%;
        padding: 12px;
        font-size: 17px;
        border: 1px solid #000;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .submit-btn {
        width: 100%;
        padding: 18px;
        background: #000;
        color: #fff;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
    }
</style>
</head>

<body>
<div class="container">

    <!-- LINEでも表示されるように画像をbase64に変更 -->
    <img src="https://yourdomain.com/logo.png" alt="Candoll Logo" class="logo">

    <div class="greeting">
        いつもお世話になっております。\nご予約内容の入力をお願いいたします。
    </div>

    <form id="reserveForm">
        <label for="menu">メニュー</label>
        <div id="menuContainer">
            <select class="menu-select" required>
                <option value="">選択してください</option>
                <option value="カット">カット</option>
                <option value="カラー">カラー</option>
                <option value="パーマ">パーマ</option>
                <option value="ストレート">ストレート</option>
            </select>
        </div>

        <label for="date">日付</label>
        <select id="date" required></select>

        <label for="time">時間</label>
        <select id="time" required>
            <option value="">時間を選択</option>
            <option value="10:00">10:00</option>
            <option value="10:30">10:30</option>
            <option value="11:00">11:00</option>
            <option value="11:30">11:30</option>
            <option value="12:00">12:00</option>
            <option value="12:30">12:30</option>
            <option value="13:00">13:00</option>
            <option value="13:30">13:30</option>
            <option value="14:00">14:00</option>
            <option value="14:30">14:30</option>
            <option value="15:00">15:00</option>
            <option value="15:30">15:30</option>
            <option value="16:00">16:00</option>
            <option value="16:30">16:30</option>
            <option value="17:00">17:00</option>
            <option value="17:30">17:30</option>
            <option value="18:00">18:00</option>
        </select>

        <button class="submit-btn" type="submit">予約する</button>
    </form>
</div>

<script>
// 日付自動生成（曜日付き）
const dateSelect = document.getElementById("date");
const daysOfWeek = ['日','月','火','水','木','金','土'];
for (let i = 0; i < 30; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const y = d.getFullYear();
    const m = (d.getMonth() + 1).toString().padStart(2, '0');
    const day = d.getDate().toString().padStart(2, '0');
    const dow = daysOfWeek[d.getDay()];

    const option = document.createElement('option');
    option.value = `${y}-${m}-${day}`;
    option.textContent = `${y}/${m}/${day} (${dow})`;
    dateSelect.appendChild(option);
}

// メニュー複数選択追加
const menuContainer = document.getElementById('menuContainer');
menuContainer.addEventListener('change', function(e){
    if(e.target.classList.contains('menu-select') && e.target.value !== ''){
        // 既に追加済みなら何もしない
        const selects = menuContainer.querySelectorAll('.menu-select');
        if(selects.length < 2){
            const newSelect = e.target.cloneNode(true);
            newSelect.value = '';
            menuContainer.appendChild(newSelect);
        }
    }
});

// フォーム送信
document.getElementById('reserveForm').addEventListener('submit', function(e){
    e.preventDefault();
    const menus = Array.from(menuContainer.querySelectorAll('.menu-select')).map(s => s.value).filter(v => v !== '');
    const date = dateSelect.value;
    const time = document.getElementById('time').value;

    alert(`予約内容:\nメニュー: ${menus.join(', ')}\n日付: ${date}\n時間: ${time}`);
});
</script>

</body>
</html>
