<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candoll 予約フォーム</title>
<style>
 body { font-family: "Hiragino Sans", sans-serif; background: #fff; padding: 20px; }
 h1 { font-size: 24px; margin-bottom: 10px; }
 label { display: block; margin-top: 15px; }
 select, input { padding: 8px; font-size: 16px; }
 #timeTable { margin-top: 20px; border-collapse: collapse; width: 100%; }
 #timeTable th, #timeTable td { border: 1px solid #ccc; padding: 5px; text-align: center; }
 .ok { background: #c8f7c5; }
 .ng { background: #f7c5c5; }
</style>
</head>
<body>
<h1>Candoll 予約フォーム</h1>

<form id="reserveForm">
  <label>メニューを選択：</label>
  <select id="menuSelect"></select>

  <label>日付を選択：</label>
  <input type="date" id="dateInput" />

  <label>時間を選択：</label>
  <select id="timeSelect"></select>

  <button type="submit">予約する</button>
</form>

<h2>時間の空き状況（⭕/❌）</h2>
<table id="timeTable"></table>

<script>
const menuData = [
  { name: "通常コース", times: ["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00"] },
  { name: "ロングコース", times: ["10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00"] }
];

const menuSelect = document.getElementById("menuSelect");
const dateInput = document.getElementById("dateInput");
const timeSelect = document.getElementById("timeSelect");
const timeTable = document.getElementById("timeTable");

menuData.forEach(m => {
  const op = document.createElement("option");
  op.value = m.name;
  op.textContent = m.name;
  menuSelect.appendChild(op);
});

function updateTimes() {
  const menu = menuData.find(x => x.name === menuSelect.value);
  timeSelect.innerHTML = "";
  menu.times.forEach(t => {
    const op = document.createElement("option");
    op.value = t;
    op.textContent = t;
    timeSelect.appendChild(op);
  });
}
updateTimes();
menuSelect.addEventListener("change", () => { updateTimes(); updateTimeTable(); });
dateInput.addEventListener("change", updateTimeTable);

async function updateTimeTable() {
  if (!dateInput.value) return;
  const menu = menuSelect.value;
  const res = await fetch(`/api/freeTimes?date=${dateInput.value}&menu=${menu}`);
  const data = await res.json();

  timeTable.innerHTML = "";
  let header = "<tr><th>時間</th><th>状態</th></tr>";
  timeTable.insertAdjacentHTML("beforeend", header);

  data.freeTimes.forEach(t => {
    const isFree = data.freeList.includes(t);
    const row = `<tr class="${isFree ? 'ok':'ng'}"><td>${t}</td><td>${isFree ? '⭕':'❌'}</td></tr>`;
    timeTable.insertAdjacentHTML("beforeend", row);
  });
}
</script>
</body>
</html>
