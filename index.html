<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candoll 予約フォーム</title>

    <style>
        body {
            font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
            background: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 420px;
            margin: 0 auto;
            padding: 20px 0 40px;
            text-align: center;
        }
        .greeting {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        select, input {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            border: 1px solid #000;
            border-radius: 6px;
            margin-bottom: 20px;
            box-sizing: border-box; /* はみ出し防止 */
        }
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: #000;
            color: #fff;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
        #menuContainer {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #addMenu {
            color: #007bff;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            text-decoration: underline;
        }
        #confirm-screen {
            display: none;
            padding: 20px;
        }
        .confirm-btn {
            width: 45%;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            margin: 10px;
            border: none;
            cursor: pointer;
        }
        .ok { background: #000; color: #fff; }
        .cancel { background: #ccc; color: #000; }
        #name { width: 100%; box-sizing: border-box; display: block; }
        /* --- Apple風 日付チップのデザイン --- */
.date-chips {
    display: flex;
    overflow-x: auto; /* 横スクロールを有効に */
    gap: 12px;
    padding: 10px 0;
    margin-bottom: 20px;
    /* スクロールバーを隠す（iPhone/Android/Chrome用） */
    -webkit-overflow-scrolling: touch;
}
.date-chips::-webkit-scrollbar {
    display: none;
}

.date-chip {
    flex: 0 0 auto;
    width: 60px;
    height: 75px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s ease;
}

/* 選択された時の黒背景 */
.date-chip.selected {
    background: #000;
    color: #fff;
    border-color: #000;
}

/* --- Apple風 時間タイルのデザイン --- */
.time-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3列に並べる */
    gap: 10px;
    margin-bottom: 20px;
}

.time-slot {
    padding: 15px 5px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
}

/* 選択された時 */
.time-slot.selected {
    background: #000;
    color: #fff;
    border-color: #000;
}

/* 予約不可の時 */
.time-slot.disabled {
    background: #f5f5f7;
    color: #d2d2d7;
    border-color: #f5f5f7;
    cursor: not-allowed;
}
        /* --- 追加：名前入力とメニューチップのデザイン --- */
.input-wrapper {
    margin-bottom: 25px;
}
#name {
    border: 1px solid #e0e0e0;
    background-color: #f5f5f7;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    transition: all 0.3s ease;
}
#name:focus {
    outline: none;
    border-color: #000;
    background-color: #fff;
    box-shadow: 0 0 0 4px rgba(0,0,0,0.05);
}

/* Apple風のセレクトボックスデザイン */
.select-wrapper {
    position: relative;
    margin-bottom: 25px;
}

.apple-select {
    appearance: none; /* ブラウザ標準の矢印を消す */
    -webkit-appearance: none;
    border: 1px solid #e0e0e0;
    background-color: #f5f5f7;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    cursor: pointer;
    background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
    background-repeat: no-repeat;
    background-position: right 15px center;
    background-size: 18px;
}

.apple-select:focus {
    outline: none;
    border-color: #000;
    background-color: #fff;
}
        /* 追加ボタンのホバー演出（任意） */
#addMenu:active {
    opacity: 0.5;
}

/* プルダウン内のカテゴリー（optgroup）の見た目 */
optgroup {
    font-style: normal;
    font-weight: bold;
    color: #86868b;
    background: #fff;
}
option {
    color: #000;
}
    </style>
</head>

<body>
<div class="container">
    <img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
         alt="Candoll ロゴ"
         style="width: 250px; display: block; margin: 0 auto 20px;">

    <div class="greeting" id="greeting">
        いつもお世話になっております。<br>
        ご予約内容をお選び下さい。
    </div>

    <form id="reserveForm" novalidate>
        <div id="errorBox" style="display:none; color:#c00; margin-bottom:15px; font-size:14px;"></div>

<label for="name">お名前</label>
<div class="input-wrapper">
    <input type="text" id="name" placeholder="お名前を入力してください" autocomplete="off">
</div>

<label>メニュー</label>
<div id="menuContainer" class="menu-stack">
    <div class="select-wrapper">
        <select class="menu-select apple-select placeholder-color">
            <option value="">メニューを選択してください</option>
        </select>
    </div>
</div>

<div id="addMenu" class="add-menu-btn">他のメニューを追加</div>

<label for="date">日付</label>
<div id="dateChips" class="date-chips"></div> 
<select id="date" style="display:none;"></select>

<label for="time">時間</label>
<div id="timeGrid" class="time-grid"></div>
<select id="time" style="display:none;" required>
    <option value="">時間を選択</option>
    <option value="10:00">10:00</option>
    <option value="10:30">10:30</option>
    <option value="11:00">11:00</option>
    <option value="11:30">11:30</option>
    <option value="12:00">12:00</option>
    <option value="12:30">12:30</option>
    <option value="13:00">13:00</option>
    <option value="13:30">13:30</option>
    <option value="14:00">14:00</option>
    <option value="14:30">14:30</option>
    <option value="15:00">15:00</option>
    <option value="15:30">15:30</option>
    <option value="16:00">16:00</option>
    <option value="16:30">16:30</option>
    <option value="17:00">17:00</option>
    <option value="17:30">17:30</option>
    <option value="18:00">18:00</option>
</select>

        <button class="submit-btn" type="submit">予約する</button>
        <p style="font-size:12px; color:#555; margin-top:10px;">
            ※ キャンセルの場合、ご意見ご要望等は、お電話やLINEにて承ります。
        </p>
    </form>

    <div id="confirm-screen">
        <h2>ご予約内容</h2>
        <p id="confirm-text"></p>
        <button class="confirm-btn ok" id="okBtn">OK</button>
        <button class="confirm-btn cancel" id="cancelBtn">戻る</button>
    </div>
</div>


<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
