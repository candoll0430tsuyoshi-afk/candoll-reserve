<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candoll 予約フォーム</title>
<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        color: #000000;
        margin: 0;
        padding: 0;
        text-align: center;
    }
    .container {
        width: 90%;
        max-width: 420px;
        margin: 0 auto;
        padding: 20px 0 40px;
    }
    label {
        font-size: 18px;
        margin-bottom: 8px;
        font-weight: 600;
        text-align: center;
        display: block;
    }
    select {
        width: 100%;
        padding: 12px;
        font-size: 17px;
        border: 1px solid #000;
        border-radius: 6px;
        margin-bottom: 20px;
    }
    .submit-btn {
        width: 100%;
        padding: 18px;
        background: #000;
        color: #fff;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
    }

    /* メニュー複数追加用 */
    #menuContainer {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* 「メニューを追加する」リンク風ボタン */
    #addMenu {
        margin-top: -10px;
        font-size: 13px;
        color: #007bff;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        width: 100px;
        margin: 0 auto 20px;
    }
</style>
</head>
<body>
<div class="container">

<img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
     alt="Candoll ロゴ"
     style="width: 250px; display: block; margin: 0 auto 20px;">

<h1>Candoll 予約フォーム</h1>

<div class="greeting">
    いつもお世話になっております。<br>
    ご予約内容をお選び下さい。
</div>

<form id="reserveForm">

    <label>メニュー</label>

    <div id="menuContainer">
        <!-- 初期メニュー枠 -->
        <select class="menu-select">
            <option value="">選択してください</option>
            <optgroup label="組み合わせ">
                <option value="カット＋カラー">カット＋カラー</option>
                <option value="カット＋リタッチカラー">カット＋リタッチカラー</option>
                <option value="カット＋パーマ">カット＋パーマ</option>
                <option value="カット＋ストレート">カット＋ストレート</option>
            </optgroup>
            <optgroup label="カット">
                <option value="カット">カット</option>
                <option value="カット（大学生・専門学生）">カット（大学生・専門学生）</option>
                <option value="カット（中学生以下）">カット（中学生以下）</option>
                <option value="前髪カット">前髪カット</option>
            </optgroup>
            <optgroup label="カラー">
                <option value="カラー">カラー</option>
                <option value="リタッチカラー">リタッチカラー</option>
                <option value="ダブルカラー">ダブルカラー</option>
                <option value="アクセントカラー">アクセントカラー</option>
                <option value="ヘナ">ヘナ</option>
            </optgroup>
            <optgroup label="パーマ">
                <option value="モイストパーマ">モイストパーマ</option>
                <option value="ポイントパーマ">ポイントパーマ</option>
            </optgroup>
            <optgroup label="ストレート">
                <option value="ストレートパーマ">ストレートパーマ</option>
                <option value="ポイントストレートパーマ">ポイントストレートパーマ</option>
            </optgroup>
            <optgroup label="トリートメント">
                <option value="トリートメント">トリートメント</option>
            </optgroup>
            <optgroup label="メニュー未定">
                <option value="来店時に相談（２時間枠）">来店時に相談（２時間枠）</option>
                <option value="来店時に相談（３時間枠）">来店時に相談（３時間枠）</option>
            </optgroup>
        </select>
    </div>

    <!-- メニュー追加ボタン -->
    <button type="button" id="addMenu">メニューを追加する</button>

    <label for="date">日付</label>
    <select id="date" required></select>

    <label for="time">時間</label>
    <select id="time" required></select>

    <button class="submit-btn" type="submit">予約する</button>

</form>
</div>

<script>
/* -------------------
   ■ 日付の自動生成
------------------- */
const dateSelect = document.getElementById("date");
const daysOfWeek = ['日','月','火','水','木','金','土'];

for (let i = 0; i < 30; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const y = d.getFullYear();
    const m = (d.getMonth() + 1).toString().padStart(2, '0');
    const day = d.getDate().toString().padStart(2, '0');
    const dow = daysOfWeek[d.getDay()];
    const option = document.createElement('option');
    option.value = `${y}-${m}-${day}`;
    option.textContent = `${y}/${m}/${day} (${dow})`;
    dateSelect.appendChild(option);
}

/* -------------------
   ■ 時間の自動生成
------------------- */
const timeSelect = document.getElementById("time");

function generateTimes() {
    timeSelect.innerHTML = ""; // いったんクリア

    const start = 10 * 60; // 10:00 → 分に変換
    const end = 18 * 60;   // 18:00
    const interval = 30;   // 30分ごとの区切り

    for (let t = start; t <= end; t += interval) {
        const h = String(Math.floor(t / 60)).padStart(2, "0");
        const m = String(t % 60).padStart(2, "0");
        const option = document.createElement("option");
        option.value = `${h}:${m}`;
        option.textContent = `${h}:${m}`;
        timeSelect.appendChild(option);
    }
}

dateSelect.addEventListener("change", generateTimes);
// 初回は空欄表示のため呼ばない（昨日の仕様に合わせる）


/* -------------------
   ■ メニュー複数追加
------------------- */
const menuContainer = document.getElementById('menuContainer');
const addMenuButton = document.getElementById('addMenu');

addMenuButton.addEventListener("click", function () {
    const selects = menuContainer.querySelectorAll('.menu-select');

    if (selects.length >= 4) return;

    const newSelect = selects[0].cloneNode(true);
    newSelect.value = "";
    menuContainer.appendChild(newSelect);

    if (menuContainer.querySelectorAll('.menu-select').length >= 4) {
        addMenuButton.style.display = "none";
    }
});


/* -------------------
   ■ 送信
------------------- */
document.getElementById('reserveForm').addEventListener('submit', function(e){
    e.preventDefault();

    const menus = Array.from(menuContainer.querySelectorAll('.menu-select'))
                       .map(s => s.value)
                       .filter(v => v !== '');

    const date = dateSelect.value;
    const time = timeSelect.value;

    alert(`予約内容:\nメニュー: ${menus.join(', ')}\n日付: ${date}\n時間: ${time}`);
});
</script>

</body>
</html>
