<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candoll 予約フォーム</title>
<style>
    body {
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background: #ffffff;
        color: #000000;
        margin: 0;
        padding: 0;
        text-align: center;
    }
    .container {
        width: 90%;
        max-width: 420px;
        margin: 0 auto;
        padding: 20px 0 40px;
        text-align: center;
    }
    .logo {
        width: 120px;
        margin: 0 auto 20px;
        display: block;
    }
    .greeting {
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 20px;
        text-align: center;
    }
    label {
        font-size: 18px;
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        text-align: center;
    }
    select {
        width: 100%;
        padding: 12px;
        font-size: 17px;
        border: 1px solid #000;
        border-radius: 6px;
        margin-bottom: 20px;
    }
    .submit-btn {
        width: 100%;
        padding: 18px;
        background: #000;
        color: #fff;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
    }

    #menuContainer {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
</style>
</head>

<body>
<div class="container">

<!-- ロゴは触らない -->
<img src="https://candoll0430tsuyoshi-afk.github.io/candoll-reserve/logo.png"
     alt="Candoll ロゴ"
     style="width: 250px; display: block; margin: 0 auto 20px;">

<!-- ★ あなたの要望通り、ここの「Candoll 予約フォーム」という文字は削除 ★ -->

<div class="greeting">
    いつもお世話になっております。<br>
    ご予約内容をお選び下さい。
</div>

<form id="reserveForm">

    <label for="menu">メニュー</label>
    <div id="menuContainer">
        <select class="menu-select">
            <option value="">選択してください</option>

            <optgroup label="組み合わせ">
                <option value="カット＋カラー">カット＋カラー</option>
                <option value="カット＋リタッチカラー">カット＋リタッチカラー</option>
                <option value="カット＋パーマ">カット＋パーマ</option>
                <option value="カット＋ストレート">カット＋ストレート</option>
            </optgroup>

            <optgroup label="カット">
                <option value="カット">カット</option>
                <option value="カット（大学生・専門学生）">カット（大学生・専門学生）</option>
                <option value="カット（中学生以下）">カット（中学生以下）</option>
                <option value="前髪カット">前髪カット</option>
            </optgroup>

            <optgroup label="カラー">
                <option value="カラー">カラー</option>
                <option value="リタッチカラー">リタッチカラー</option>
                <option value="ダブルカラー">ダブルカラー</option>
                <option value="アクセントカラー">アクセントカラー</option>
                <option value="ヘナ">ヘナ</option>
            </optgroup>

            <optgroup label="パーマ">
                <option value="モイストパーマ">モイストパーマ</option>
                <option value="ポイントパーマ">ポイントパーマ</option>
            </optgroup>

            <optgroup label="ストレート">
                <option value="ストレートパーマ">ストレートパーマ</option>
                <option value="ポイントストレートパーマ">ポイントストレートパーマ</option>
            </optgroup>

            <optgroup label="トリートメント">
                <option value="トリートメント">トリートメント</option>
            </optgroup>

            <optgroup label="メニュー未定">
                <option value="来店時に相談（２時間枠）">来店時に相談（２時間枠）</option>
                <option value="来店時に相談（３時間枠）">来店時に相談（３時間枠）</option>
            </optgroup>
        </select>
    </div>

    <label for="date">日付</label>
    <select id="date" required></select>

    <label for="time">時間</label>
    <select id="time" required>
        <option value="">時間を選択</option>
    </select>

    <button class="submit-btn" type="submit">予約する</button>
</form>
</div>

<script>
// ===== 日付生成 =====
const dateSelect = document.getElementById("date");
const daysOfWeek = ['日','月','火','水','木','金','土'];

for (let i = 0; i < 30; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);

    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const dow = daysOfWeek[d.getDay()];

    const option = document.createElement("option");
    option.value = `${y}-${m}-${day}`;
    option.textContent = `${y}/${m}/${day} (${dow})`;

    dateSelect.appendChild(option);
}

// ===== メニュー追加複製 =====
const menuContainer = document.getElementById("menuContainer");
menuContainer.addEventListener("change", function(e){
    if(e.target.classList.contains("menu-select") && e.target.value !== ""){
        const selects = menuContainer.querySelectorAll(".menu-select");
        if(selects.length < 4){
            const copy = e.target.cloneNode(true);
            copy.value = "";
            menuContainer.appendChild(copy);
        }
    }
});

// ===== 時間のリスト =====
const timeSelect = document.getElementById("time");

function generateTimeOptions() {
    timeSelect.innerHTML = '<option value="">時間を選択</option>';
    const times = [];

    for (let h = 10; h <= 18; h++) {
        times.push(`${String(h).padStart(2,"0")}:00`);
        if (h !== 18) times.push(`${String(h).padStart(2,"0")}:30`);
    }

    times.forEach(t => {
        const op = document.createElement("option");
        op.value = t;
        op.textContent = t;
        timeSelect.appendChild(op);
    });
}

generateTimeOptions();

// ===== Google Calendar API と連携（バックエンド必要）=====
// 予約の入っている時間を取得し、該当時間をグレーアウト
dateSelect.addEventListener("change", async () => {
    generateTimeOptions();

    const date = dateSelect.value;
    if (!date) return;

    const res = await fetch(`/api/calendarBusy?date=${date}`);
    const data = await res.json();  // 例：{ busyTimes:["10:30","13:00"] }

    if (data.busyTimes) {
        data.busyTimes.forEach(t => {
            const op = timeSelect.querySelector(`option[value="${t}"]`);
            if (op) {
                op.disabled = true;
                op.style.background = "#ddd";
            }
        });
    }
});

// ===== 予約送信 =====
document.getElementById("reserveForm").addEventListener("submit", function(e){
    e.preventDefault();

    const menus = Array.from(menuContainer.querySelectorAll(".menu-select"))
        .map(s => s.value)
        .filter(v => v !== "");

    const date = dateSelect.value;
    const time = timeSelect.value;

    alert(`予約内容:\nメニュー: ${menus.join(", ")}\n日付: ${date}\n時間: ${time}`);
});
</script>
</body>
</html>
