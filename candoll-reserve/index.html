<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candoll予約フォーム</title>
</head>
<body>
  <h2>いつもお世話になっております。ご予約をお取りしますので、下記メニューからお選びください。</h2>

  <form>
    <label>メニュー：</label>
    <select name="menu">
      <option value="">選択してください</option>
      <option value="cut">カット</option>
      <option value="cut_color">カット＋カラー</option>
      <option value="color">カラー</option>
      <option value="perm">パーマ</option>
      <option value="straight">ストレートパーマ</option>
      <option value="treatment">トリートメント</option>
      <option value="consult">来店時に相談</option>
    </select>

    <br><br>
    <label>希望日時：</label>
    <input type="datetime-local" name="datetime" />

    <br><br>
    <label>備考：</label><br>
    <textarea name="notes" rows="3" cols="30"></textarea>

    <br><br>
    <button type="submit">予約する</button>
  </form>
</body>
</html>
